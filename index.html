<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>UTBK Training</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div id="app">
    <div class="loading">Loading…</div>
  </div>
  <div id="modal-root"></div>
  <noscript>Turn on JavaScript to take the test.</noscript>
  <script>
    /* always load the newest settings and code (no old cached copies) */
    (function () {
      var v = Date.now(), files = ["config.js", "assets/common.js", "assets/app.js"];
      (function next(i) {
        if (i >= files.length) return;
        var s = document.createElement("script");
        s.src = files[i] + "?v=" + v;
        s.onload = function () { next(i + 1); };
        s.onerror = function () { document.getElementById("app").innerHTML = '<div class="loading">Could not load. Check your internet, then reload the page.</div>'; };
        document.body.appendChild(s);
      })(0);
    })();
  </script>
</body>
</html>
